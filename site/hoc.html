<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-sub: #f1f5f9;
  --ink: #0f172a;
  --mute: #64748b;
  --line: #e2e8f0;
  --acc: #2563eb;
  --acc-hover: #1d4ed8;
  --acc-soft: #eff6ff;
  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --bad: #dc2626;
  --bad-soft: #fee2e2;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --radius: 14px;
}

:root[data-theme="dark"] {
  --bg: #0b0f17;
  --card: #151c28;
  --card-sub: #1e2738;
  --ink: #f1f5f9;
  --mute: #94a3b8;
  --line: #263348;
  --acc: #3b82f6;
  --acc-hover: #60a5fa;
  --acc-soft: #1a2744;
  --ok: #22c55e;
  --ok-soft: #143522;
  --bad: #ef4444;
  --bad-soft: #381a1d;
  --warn: #f59e0b;
  --warn-soft: #3a2a11;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  transition: background .25s ease, color .25s ease;
  padding-bottom: 80px;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
  padding: 12px 16px;
}
.header-wrap {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  font-size: 1.1rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.brand span {
  color: var(--acc);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-icon {
  background: var(--card-sub);
  border: 1px solid var(--line);
  color: var(--ink);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.1rem;
  transition: .15s;
}
.btn-icon:hover { border-color: var(--acc); color: var(--acc); }


.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-link {
  padding: 6px 12px;
  border-radius: 8px;
  text-decoration: none;
  font-size: .86rem;
  font-weight: 600;
  color: var(--mute);
  transition: .15s;
}
.nav-link:hover { color: var(--ink); background: var(--card-sub); }
.nav-link.active {
  color: var(--acc);
  background: var(--acc-soft);
}

/* PROGRESS BAR */
.progress-bar-wrap {
  width: 100%;
  height: 4px;
  background: var(--line);
  position: absolute;
  bottom: 0;
  left: 0;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--acc);
  transition: width .3s ease;
}

/* MAIN CONTAINER */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
}

/* CLUSTER FILTER TABS */
.clusters-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
  scrollbar-width: none;
}
.clusters-nav::-webkit-scrollbar { display: none; }
.cluster-btn {
  white-space: nowrap;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--mute);
  font-weight: 600;
  font-size: .88rem;
  cursor: pointer;
  transition: .15s;
}
.cluster-btn:hover { color: var(--ink); border-color: var(--mute); }
.cluster-btn.active {
  background: var(--acc);
  border-color: var(--acc);
  color: #fff;
}

/* LESSON LIST HORIZONTAL PILLS */
.lessons-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 14px;
  margin-bottom: 12px;
  scrollbar-width: none;
}
.lessons-strip::-webkit-scrollbar { display: none; }
.lesson-pill {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: .88rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: .15s;
}
.lesson-pill:hover { border-color: var(--acc); }
.lesson-pill.active {
  background: var(--acc-soft);
  border-color: var(--acc);
  color: var(--acc);
}
.lesson-pill.done::after {
  content: "✓";
  color: var(--ok);
  font-weight: 800;
}

/* LESSON CARD */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
}

.lesson-header {
  border-bottom: 1px solid var(--line);
  padding-bottom: 16px;
  margin-bottom: 20px;
}
.lesson-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.badge {
  font-size: .75rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--acc-soft);
  color: var(--acc);
}
.badge.source {
  background: var(--card-sub);
  color: var(--mute);
}
h1.lesson-title {
  font-size: 1.45rem;
  font-weight: 800;
  margin: 4px 0 8px;
  line-height: 1.35;
}
.lesson-desc {
  color: var(--mute);
  font-size: .95rem;
  margin: 0;
}

/* SUB TABS INSIDE LESSON */
.sub-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 2px solid var(--line);
  margin-bottom: 20px;
}
.sub-tab-btn {
  padding: 10px 14px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  color: var(--mute);
  font-weight: 700;
  font-size: .92rem;
  cursor: pointer;
  transition: .15s;
}
.sub-tab-btn:hover { color: var(--ink); }
.sub-tab-btn.active {
  color: var(--acc);
  border-bottom-color: var(--acc);
}

/* CONTENT STYLES */
.step-block {
  margin-bottom: 24px;
}
.step-block h3 {
  font-size: 1.12rem;
  font-weight: 700;
  margin: 0 0 10px;
  color: var(--acc);
  display: flex;
  align-items: center;
  gap: 8px;
}
.step-block p, .step-block ul, .step-block ol {
  font-size: 1rem;
  line-height: 1.65;
  margin: 0 0 12px;
}
.tip-box, .warn-box, .code-box {
  padding: 14px 16px;
  border-radius: 12px;
  margin: 14px 0;
  font-size: .92rem;
}
.tip-box {
  background: var(--acc-soft);
  border-left: 4px solid var(--acc);
  color: var(--ink);
}
.warn-box {
  background: var(--warn-soft);
  border-left: 4px solid var(--warn);
  color: var(--ink);
}
.code-box {
  background: var(--card-sub);
  border: 1px solid var(--line);
  font-family: "Fira Code", monospace;
  font-size: .88rem;
  white-space: pre-wrap;
  overflow-x: auto;
}

/* TABLES */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: .9rem;
}
.data-table th, .data-table td {
  border: 1px solid var(--line);
  padding: 9px 12px;
  text-align: left;
}
.data-table th {
  background: var(--card-sub);
  font-weight: 700;
}

/* EXAMPLES CARDS */
.example-card {
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.example-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.example-level {
  font-size: .75rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
}
.example-level.Cơ.bản { background: var(--ok-soft); color: var(--ok); }
.example-level.Trung.bình { background: var(--warn-soft); color: var(--warn); }
.example-level.Vận.dụng { background: var(--bad-soft); color: var(--bad); }

.example-q {
  font-weight: 600;
  margin-bottom: 12px;
}
.example-sol {
  border-top: 1px dashed var(--line);
  padding-top: 12px;
  font-size: .92rem;
  line-height: 1.6;
}

/* PITFALLS */
.pitfall-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
@media (max-width: 640px) {
  .pitfall-row { grid-template-columns: 1fr; }
}
.pitfall-col {
  padding: 14px;
  border-radius: 12px;
  font-size: .9rem;
  line-height: 1.5;
}
.pitfall-bad {
  background: var(--bad-soft);
  border: 1px solid var(--bad);
  color: var(--ink);
}
.pitfall-good {
  background: var(--ok-soft);
  border: 1px solid var(--ok);
  color: var(--ink);
}

/* QUIZ INTERACTION */
.quiz-box {
  margin-top: 10px;
}
.quiz-q {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 16px;
}
.quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  margin-bottom: 10px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: .95rem;
  font-weight: 500;
  cursor: pointer;
  transition: .15s;
}
.quiz-opt:hover:not(:disabled) {
  border-color: var(--acc);
  background: var(--acc-soft);
}
.quiz-opt.ok {
  border-color: var(--ok);
  background: var(--ok-soft);
  font-weight: 700;
}
.quiz-opt.no {
  border-color: var(--bad);
  background: var(--bad-soft);
}
.quiz-opt:disabled { cursor: default; }

.feedback-box {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 12px;
  font-size: .95rem;
  line-height: 1.55;
  animation: fadeIn .2s ease;
}
.feedback-box.ok { background: var(--ok-soft); border-left: 4px solid var(--ok); }
.feedback-box.no { background: var(--bad-soft); border-left: 4px solid var(--bad); }

/* WIDGET STYLES */
.widget-container {
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  margin: 18px 0;
}
.widget-title {
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.widget-slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0;
}
.widget-slider-row input[type="range"] {
  flex: 1;
  accent-color: var(--acc);
}
.widget-stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.widget-stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.widget-stat-card small {
  display: block;
  font-size: .75rem;
  color: var(--mute);
}
.widget-stat-card b {
  font-size: 1.15rem;
  color: var(--acc);
}

/* HISTOGRAM FOR CLT */
.clt-bars {
  display: flex;
  align-items: flex-end;
  height: 120px;
  gap: 2px;
  background: var(--card);
  border-radius: 8px;
  padding: 8px 4px 0;
  margin: 12px 0;
  border: 1px solid var(--line);
}
.clt-bars i {
  flex: 1;
  background: var(--acc);
  border-radius: 2px 2px 0 0;
  min-height: 2px;
  transition: height .2s ease;
}

/* BOTTOM NAVIGATION BUTTONS */
.bottom-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
}
.btn {
  padding: 12px 20px;
  border-radius: 12px;
  font-size: .95rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: .15s;
}
.btn-primary { background: var(--acc); color: #fff; }
.btn-primary:hover { background: var(--acc-hover); }
.btn-secondary { background: var(--card-sub); border: 1px solid var(--line); color: var(--ink); }
.btn-secondary:hover { border-color: var(--mute); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<script id="lessons-data">
// ==========================================================================
// TOÀN BỘ 26 BÀI HỌC TỰ HỌC TƯƠNG TÁC (CỤM A, B, C, D, E)
// UET.MAT1052 — Xác suất Thống kê
// ==========================================================================

// ==========================================================================
// CỤM A: DỮ LIỆU VÀ THỐNG KÊ MÔ TẢ
// Bao gồm: Bài A1, A2, A3, A4, A5
// Nguồn: Slide UET Week 01 - 04, Stat20 Chương 1, Chương 2, Mục 7.2
// Kiểm chứng số học: verify/verify_cum_a.py
// ==========================================================================

const CUM_A = [
  {
    id: "A1",
    cluster: "A",
    title: "Khung dữ liệu và Các loại biến",
    sources: "Slide Week 01 (tr. 1–75); Stat20 Mục 1.1, 1.2, 1.3",
    desc: "Nắm vững cách cấu trúc dữ liệu dưới dạng bảng và phân loại chính xác 4 họ biến: Định danh, Thứ bậc, Rời rạc, Liên tục. Không bao giờ mắc bẫy mã số.",
    steps: [
      {
        t: "Cấu trúc dữ liệu: Khung dữ liệu (Data Frame)",
        c: `<p>Trong thống kê và khoa học dữ liệu, dữ liệu luôn được tổ chức dưới dạng một bảng chữ nhật gọi là <b>Khung dữ liệu (Data Frame)</b>:</p>
            <ul>
              <li><b>Mỗi hàng (Row)</b>: Đại diện cho một <b>đơn vị quan sát</b> (Observation) — ví dụ: một sinh viên, một bệnh nhân, một chuyến bay.</li>
              <li><b>Mỗi cột (Column)</b>: Đại diện cho một <b>biến số</b> (Variable) — đặc tính đo lường được của đối tượng (ví dụ: Chiều cao, Điểm GPA, Ngành học).</li>
            </ul>
            <div class="tip-box"><b>Quy tắc vàng:</b> Trước khi tính toán bất kỳ chỉ số nào, bạn phải biết rõ đơn vị quan sát ở mỗi hàng là gì và cột bạn đang xét thuộc loại biến nào!</div>`
      },
      {
        t: "Hai họ biến lớn: Phân loại vs Biến số",
        c: `<p>Mọi biến số trên đời đều thuộc một trong hai họ lớn:</p>
            <ol>
              <li><b>Biến phân loại (Categorical variable)</b>: Giá trị là một từ ngữ, một nhãn hoặc một nhóm phân loại (ví dụ: Giới tính, Quê quán, Nhóm máu).</li>
              <li><b>Biến số (Numerical variable)</b>: Giá trị là một con số đo lường hoặc đếm được, và việc làm các phép tính số học (cộng, trừ, tính trung bình) với nó <b>có ý nghĩa thực tế</b>.</li>
            </ol>
            <div class="warn-box">
              <b>⚠️ CẠM BẪY CHÍ MẠNG: Mã số không phải là biến số!</b><br>
              Mã số sinh viên (23020123), Số điện thoại (0912345678), Mã bưu chính, Mã chuyến bay (VN215) tuy được viết bằng các chữ số, nhưng chúng thực chất chỉ là <b>nhãn định danh</b> dùng để phân biệt các đối tượng. Việc lấy trung bình cộng hai mã số sinh viên là hoàn toàn vô nghĩa! Vì vậy, chúng thuộc họ <b>Biến phân loại</b>.
            </div>`
      },

            <ul>
              <li>$r$ luôn nằm trong đoạn $[-1, 1]$.</li>
              <li><b>Dấu của $r$</b> cho biết chiều của mối quan hệ:
                <ul>

                  <li>$r = 0$: Không có mối liên hệ <i>tuyến tính</i>.</li>
                </ul>
              </li>
              <li><b>Độ lớn $|r|$</b> cho biết độ mạnh: $|r|$ càng gần $1$, các điểm dữ liệu càng tập trung sát vào một đường thẳng.</li>

              2. <b>Tương quan KHÔNG đồng nghĩa với Nhân quả (Correlation is NOT Causation)!</b> $r$ cao giữa điểm thi và số giờ ngủ không có nghĩa ngủ nhiều làm tăng điểm thi.

            $$\\hat{y} = b_0 + b_1 x$$

            $$\\lim_{n \\to \\infty} P(|\\bar{X}_n - \\mu| \\ge \\epsilon) = 0$$
            <p>Hay nói cách khác, trung bình mẫu <b>hội tụ theo xác suất</b> về kỳ vọng thật $\\mu$:</p>

            <ul>
              <li>Kỳ vọng: $E(\\bar{X}_n) = \\mu$.</li>
              <li>Phương sai: $\\operatorname{Var}(\\bar{X}_n) = \\frac{\\sigma^2}{n}$.</li>
            </ul>
            <p>Áp dụng Chebyshev với sai số $\\epsilon$:</p>

            <p>Khi cho cỡ mẫu $n \\to \\infty$, vì tử số $\\sigma^2$ và mẫu số $\\epsilon^2$ là các hằng số hữu hạn, nên đại lượng $\\frac{\\sigma^2}{n \\epsilon^2} \\to 0$!</p>

            $$Z = \\frac{X - \\mu}{\\sigma} \\sim \\mathcal{N}(0, 1)$$

            <div class="tip-box">

const ALL_LESSONS = [
  ...CUM_A,
  ...CUM_B,
  ...CUM_C,
  ...CUM_D,
  ...CUM_E

</script>

<script>
// STATE
let curLessonIdx = 0;
let curSubTab = 'theory';
let selectedCluster = 'ALL';
let completedLessons = {};

// Load saved state
try {
  const saved = JSON.parse(localStorage.getItem('xstk_progress') || '{}');
  completedLessons = saved.done || {};
  curLessonIdx = saved.curIdx || 0;
  if (curLessonIdx >= ALL_LESSONS.length) curLessonIdx = 0;
} catch(e) {}

function saveProgress() {
  try {
    localStorage.setItem('xstk_progress', JSON.stringify({
      done: completedLessons,
      curIdx: curLessonIdx
    }));
  } catch(e) {}
}

// THEME TOGGLE
const themeBtn = document.getElementById('themeBtn');
function initTheme() {
  const savedTheme = localStorage.getItem('xstk_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', savedTheme);
}
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('xstk_theme', next);
};
initTheme();

// RENDER CLUSTER & LESSON STRIP
function renderClusterTabs() {
  document.querySelectorAll('.cluster-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.cluster-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCluster = btn.dataset.c;
      // find first lesson of this cluster
      if (selectedCluster !== 'ALL') {
        const firstIdx = ALL_LESSONS.findIndex(l => l.cluster === selectedCluster);
        if (firstIdx !== -1) curLessonIdx = firstIdx;
      }
      renderLessonsStrip();
      renderCurrentLesson();
    };
  });
}

function renderLessonsStrip() {
  const strip = document.getElementById('lessonsStrip');
  let html = '';
  ALL_LESSONS.forEach((l, i) => {
    if (selectedCluster === 'ALL' || l.cluster === selectedCluster) {
      const isDone = completedLessons[l.id];
      const isActive = i === curLessonIdx;
      html += `<button class="lesson-pill ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="goToLesson(${i})">
        ${l.id}: ${l.title.split(':')[0]}
      </button>`;
    }
  });
  strip.innerHTML = html;
}

// SWITCH LESSON
function goToLesson(idx) {
  curLessonIdx = idx;
  curSubTab = 'theory';
  saveProgress();
  renderLessonsStrip();
  renderCurrentLesson();
  window.scrollTo({ top: 120, behavior: 'smooth' });
}

function prevLesson() {
  if (curLessonIdx > 0) goToLesson(curLessonIdx - 1);
}

function nextLesson() {
  if (curLessonIdx < ALL_LESSONS.length - 1) goToLesson(curLessonIdx + 1);
}

// RENDER CURRENT LESSON
function renderCurrentLesson() {
  const l = ALL_LESSONS[curLessonIdx];
  if (!l) return;

  document.getElementById('clusterBadge').textContent = `Cụm ${l.cluster}`;
  document.getElementById('sourceBadge').textContent = l.sources;
  document.getElementById('lessonTitle').textContent = `${l.id}: ${l.title}`;
  document.getElementById('lessonDesc').textContent = l.desc;

  // Update prev/next button states
  document.getElementById('prevBtn').disabled = (curLessonIdx === 0);
  document.getElementById('nextBtn').disabled = (curLessonIdx === ALL_LESSONS.length - 1);

  // Update Progress
  const totalDone = Object.keys(completedLessons).length;
  document.getElementById('statsBadge').textContent = `${totalDone}/${ALL_LESSONS.length} bài`;
  document.getElementById('progressBar').style.width = `${(totalDone / ALL_LESSONS.length) * 100}%`;

  // Update Sub Tabs Active State
  document.querySelectorAll('.sub-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === curSubTab);
  });

  // Render Sub Tab Content
  const container = document.getElementById('tabContent');
  if (curSubTab === 'theory') {
    container.innerHTML = renderTheory(l);
    if (l.widget === 'outlier_widget') initOutlierWidget();
    if (l.widget === 'clt_widget') initCltWidget();
  } else if (curSubTab === 'examples') {
    container.innerHTML = renderExamples(l);
  } else if (curSubTab === 'pitfalls') {
    container.innerHTML = renderPitfalls(l);
  } else if (curSubTab === 'quiz') {
    container.innerHTML = renderQuiz(l);
    attachQuizEvents(l);
  }

  // Render Math with KaTeX
  if (window.renderMathInElement) {
    renderMathInElement(container, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
}

// SUB TAB RENDERERS
function renderTheory(l) {
  let html = '';
  l.steps.forEach((step, idx) => {
    html += `<div class="step-block">
      <h3><span>#${idx + 1}</span> ${step.t}</h3>
      <div>${step.c}</div>
    </div>`;
  });

  // Check for Widget insertion
  if (l.widget === 'outlier_widget') {
    html += `<div class="widget-container" id="outlierWidget">
      <div class="widget-title">🕹️ Widget Tương Tác: Thử Nghiệm Giá Trị Ngoại Lai & Tính Bền Vững</div>
      <p style="font-size: .88rem; color: var(--mute);">Kéo thanh trượt để thay đổi giá trị x (ngoại lai) và quan sát: Trung bình bị kéo lệch vùn vụt, trong khi Trung vị giữ nguyên không đổi!</p>
      <div class="widget-slider-row">
        <span>x = </span>
        <input type="range" id="outlierSlider" min="5" max="300" value="8">
        <b id="outlierVal" style="width: 45px; color: var(--acc);">8</b>
      </div>
      <div class="widget-stat-grid">
        <div class="widget-stat-card"><small>Tập dữ liệu</small><span>[4, 6, 7, 7, x]</span></div>
        <div class="widget-stat-card"><small>Trung bình (Mean)</small><b id="meanVal">6.4</b></div>
        <div class="widget-stat-card"><small>Trung vị (Median)</small><b id="medianVal" style="color: var(--ok);">7</b></div>
      </div>
    </div>`;
  }

  if (l.widget === 'clt_widget') {
    html += `<div class="widget-container" id="cltWidget">
      <div class="widget-title">🕹️ Widget Tương Tác: Mô Phỏng Định Lý Giới Hạn Trung Tâm (CLT)</div>
      <p style="font-size: .88rem; color: var(--mute);">Rút 1.500 mẫu từ phân phối Mũ (rất lệch). Hãy bấm chọn cỡ mẫu n tăng dần để chứng kiến hình chuông Gauss đối xứng tự động xuất hiện!</p>
      <div style="display:flex; gap:8px; margin: 10px 0;">
        <button class="btn btn-secondary" onclick="runClt(1)" id="cltBtn1">n = 1 (Lệch)</button>
        <button class="btn btn-secondary" onclick="runClt(5)" id="cltBtn5">n = 5</button>
        <button class="btn btn-secondary" onclick="runClt(15)" id="cltBtn15">n = 15</button>
        <button class="btn btn-primary" onclick="runClt(30)" id="cltBtn30">n = 30 (Chuẩn)</button>
      </div>
      <div class="clt-bars" id="cltBars"></div>
      <div id="cltInfo" style="font-size: .88rem; color: var(--mute);"></div>
    </div>`;
  }

  return html;
}

function renderQuiz(l) {
  const q = l.final_quiz;
  let html = `<div class="quiz-box">
    <div class="quiz-q">${q.q}</div>
    <div id="quizOpts">`;
  q.opts.forEach((opt, idx) => {
    html += `<button class="quiz-opt" data-idx="${idx}">${opt}</button>`;
  });
  html += `</div>
    <div id="quizFeedback"></div>
  </div>`;
  return html;
}

function attachQuizEvents(l) {
  const opts = document.querySelectorAll('.quiz-opt');
  const fbContainer = document.getElementById('quizFeedback');
  const q = l.final_quiz;

  opts.forEach(b => {
    b.onclick = () => {
      const chosenIdx = +b.dataset.idx;
      const isCorrect = (chosenIdx === q.ans);

      opts.forEach(opt => {
        opt.disabled = true;
        if (+opt.dataset.idx === q.ans) opt.classList.add('ok');
      });

      if (!isCorrect) b.classList.add('no');

      if (isCorrect) {
        completedLessons[l.id] = true;
        saveProgress();
        renderLessonsStrip();
        document.getElementById('statsBadge').textContent = `${Object.keys(completedLessons).length}/${ALL_LESSONS.length} bài`;
      }

      fbContainer.innerHTML = `<div class="feedback-box ${isCorrect ? 'ok' : 'no'}">
        <b>${isCorrect ? '🎉 RẤT XUẤT SẮC! ĐÚNG RỒI!' : '⚠️ CHƯA CHÍNH XÁC!'}</b><br>
        ${q.fb[chosenIdx]}
      </div>`;
    };
  });
}

// INTERACTIVE WIDGET 1: OUTLIER SLIDER
function initOutlierWidget() {
  const slider = document.getElementById('outlierSlider');
  const valText = document.getElementById('outlierVal');
  const meanText = document.getElementById('meanVal');
  const medianText = document.getElementById('medianVal');

  function update() {
    const x = +slider.value;
    valText.textContent = x;
    const arr = [4, 6, 7, 7, x];
    const mean = (4 + 6 + 7 + 7 + x) / 5;
    arr.sort((a, b) => a - b);
    const median = arr[2];

    meanText.textContent = mean.toFixed(1);
    medianText.textContent = median;
    if (x > 20) {
      meanText.style.color = 'var(--bad)';
    } else {
      meanText.style.color = 'var(--acc)';
    }
  }
  slider.oninput = update;
  update();
}

// INTERACTIVE WIDGET 2: CLT SIMULATOR
function initCltWidget() {
  window.runClt = function(n) {
    document.querySelectorAll('#cltWidget .btn').forEach(b => {
      b.classList.remove('btn-primary');
      b.classList.add('btn-secondary');
    });
    const activeBtn = document.getElementById(`cltBtn${n}`);
    if (activeBtn) {
      activeBtn.classList.remove('btn-secondary');
      activeBtn.classList.add('btn-primary');
    }

    const reps = 1500;
    const bins = 28;
    const counts = new Array(bins).fill(0);
    let sumMeans = 0;

    for (let i = 0; i < reps; i++) {
      let sampleSum = 0;
      // Exponential distribution samples
      for (let k = 0; k < n; k++) {
        sampleSum -= Math.log(1 - Math.random());
      }
      const sampleMean = sampleSum / n;
      sumMeans += sampleMean;
      const binIdx = Math.min(bins - 1, Math.max(0, Math.floor((sampleMean / 2.5) * bins)));
      counts[binIdx]++;
    }

    const maxCount = Math.max(...counts);
    let barsHtml = '';
    counts.forEach(c => {
      const pct = (c / maxCount) * 100;
      barsHtml += `<i style="height: ${Math.max(3, pct)}%;"></i>`;
    });

    document.getElementById('cltBars').innerHTML = barsHtml;
    const avg = (sumMeans / reps).toFixed(2);
    const theorySd = (1 / Math.sqrt(n)).toFixed(2);
    document.getElementById('cltInfo').innerHTML = `Trung bình mẫu mô phỏng ≈ <b>${avg}</b>. Sai số lý thuyết σ/√n = 1/√${n} ≈ <b>${theorySd}</b>. ${n >= 15 ? 'Đồ thị đã thành hình chuông Gauss đối xứng!' : 'Đồ thị vẫn còn bị lệch phải do cỡ mẫu nhỏ.'}`;
  };

  runClt(1);
}
