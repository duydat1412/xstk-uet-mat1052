<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học Xác suất Thống kê Tương tác – UET.MAT1052</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap">
<!-- KaTeX for formula rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>

<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-sub: #f1f5f9;
  --ink: #0f172a;
  --mute: #64748b;
  --line: #e2e8f0;
  --acc: #2563eb;
  --acc-hover: #1d4ed8;
  --acc-soft: #eff6ff;
  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --bad: #dc2626;
  --bad-soft: #fee2e2;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --radius: 14px;
}

:root[data-theme="dark"] {
  --bg: #0b0f17;
  --card: #151c28;
  --card-sub: #1e2738;
  --ink: #f1f5f9;
  --mute: #94a3b8;
  --line: #263348;
  --acc: #3b82f6;
  --acc-hover: #60a5fa;
  --acc-soft: #1a2744;
  --ok: #22c55e;
  --ok-soft: #143522;
  --bad: #ef4444;
  --bad-soft: #381a1d;
  --warn: #f59e0b;
  --warn-soft: #3a2a11;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  transition: background .25s ease, color .25s ease;
  padding-bottom: 80px;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
  padding: 12px 16px;
}
.header-wrap {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  font-size: 1.1rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.brand span {
  color: var(--acc);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-icon {
  background: var(--card-sub);
  border: 1px solid var(--line);
  color: var(--ink);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.1rem;
  transition: .15s;
}
.btn-icon:hover { border-color: var(--acc); color: var(--acc); }


.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-link {
  padding: 6px 12px;
  border-radius: 8px;
  text-decoration: none;
  font-size: .86rem;
  font-weight: 600;
  color: var(--mute);
  transition: .15s;
}
.nav-link:hover { color: var(--ink); background: var(--card-sub); }
.nav-link.active {
  color: var(--acc);
  background: var(--acc-soft);
}

/* PROGRESS BAR */
.progress-bar-wrap {
  width: 100%;
  height: 4px;
  background: var(--line);
  position: absolute;
  bottom: 0;
  left: 0;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--acc);
  transition: width .3s ease;
}

/* MAIN CONTAINER */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
}

/* CLUSTER FILTER TABS */
.clusters-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
  scrollbar-width: none;
}
.clusters-nav::-webkit-scrollbar { display: none; }
.cluster-btn {
  white-space: nowrap;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--mute);
  font-weight: 600;
  font-size: .88rem;
  cursor: pointer;
  transition: .15s;
}
.cluster-btn:hover { color: var(--ink); border-color: var(--mute); }
.cluster-btn.active {
  background: var(--acc);
  border-color: var(--acc);
  color: #fff;
}

/* LESSON LIST HORIZONTAL PILLS */
.lessons-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 14px;
  margin-bottom: 12px;
  scrollbar-width: none;
}
.lessons-strip::-webkit-scrollbar { display: none; }
.lesson-pill {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: .88rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: .15s;
}
.lesson-pill:hover { border-color: var(--acc); }
.lesson-pill.active {
  background: var(--acc-soft);
  border-color: var(--acc);
  color: var(--acc);
}
.lesson-pill.done::after {
  content: "✓";
  color: var(--ok);
  font-weight: 800;
}

/* LESSON CARD */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
}

.lesson-header {
  border-bottom: 1px solid var(--line);
  padding-bottom: 16px;
  margin-bottom: 20px;
}
.lesson-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.badge {
  font-size: .75rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--acc-soft);
  color: var(--acc);
}
.badge.source {
  background: var(--card-sub);
  color: var(--mute);
}
h1.lesson-title {
  font-size: 1.45rem;
  font-weight: 800;
  margin: 4px 0 8px;
  line-height: 1.35;
}
.lesson-desc {
  color: var(--mute);
  font-size: .95rem;
  margin: 0;
}

/* SUB TABS INSIDE LESSON */
.sub-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 2px solid var(--line);
  margin-bottom: 20px;
}
.sub-tab-btn {
  padding: 10px 14px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  color: var(--mute);
  font-weight: 700;
  font-size: .92rem;
  cursor: pointer;
  transition: .15s;
}
.sub-tab-btn:hover { color: var(--ink); }
.sub-tab-btn.active {
  color: var(--acc);
  border-bottom-color: var(--acc);
}

/* CONTENT STYLES */
.step-block {
  margin-bottom: 24px;
}
.step-block h3 {
  font-size: 1.12rem;
  font-weight: 700;
  margin: 0 0 10px;
  color: var(--acc);
  display: flex;
  align-items: center;
  gap: 8px;
}
.step-block p, .step-block ul, .step-block ol {
  font-size: 1rem;
  line-height: 1.65;
  margin: 0 0 12px;
}
.tip-box, .warn-box, .code-box {
  padding: 14px 16px;
  border-radius: 12px;
  margin: 14px 0;
  font-size: .92rem;
}
.tip-box {
  background: var(--acc-soft);
  border-left: 4px solid var(--acc);
  color: var(--ink);
}
.warn-box {
  background: var(--warn-soft);
  border-left: 4px solid var(--warn);
  color: var(--ink);
}
.code-box {
  background: var(--card-sub);
  border: 1px solid var(--line);
  font-family: "Fira Code", monospace;
  font-size: .88rem;
  white-space: pre-wrap;
  overflow-x: auto;
}

/* TABLES */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: .9rem;
}
.data-table th, .data-table td {
  border: 1px solid var(--line);
  padding: 9px 12px;
  text-align: left;
}
.data-table th {
  background: var(--card-sub);
  font-weight: 700;
}

/* EXAMPLES CARDS */
.example-card {
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.example-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.example-level {
  font-size: .75rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
}
.example-level.Cơ.bản { background: var(--ok-soft); color: var(--ok); }
.example-level.Trung.bình { background: var(--warn-soft); color: var(--warn); }
.example-level.Vận.dụng { background: var(--bad-soft); color: var(--bad); }

.example-q {
  font-weight: 600;
  margin-bottom: 12px;
}
.example-sol {
  border-top: 1px dashed var(--line);
  padding-top: 12px;
  font-size: .92rem;
  line-height: 1.6;
}

/* PITFALLS */
.pitfall-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
@media (max-width: 640px) {
  .pitfall-row { grid-template-columns: 1fr; }
}
.pitfall-col {
  padding: 14px;
  border-radius: 12px;
  font-size: .9rem;
  line-height: 1.5;
}
.pitfall-bad {
  background: var(--bad-soft);
  border: 1px solid var(--bad);
  color: var(--ink);
}
.pitfall-good {
  background: var(--ok-soft);
  border: 1px solid var(--ok);
  color: var(--ink);
}

/* QUIZ INTERACTION */
.quiz-box {
  margin-top: 10px;
}
.quiz-q {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 16px;
}
.quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  margin-bottom: 10px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: .95rem;
  font-weight: 500;
  cursor: pointer;
  transition: .15s;
}
.quiz-opt:hover:not(:disabled) {
  border-color: var(--acc);
  background: var(--acc-soft);
}
.quiz-opt.ok {
  border-color: var(--ok);
  background: var(--ok-soft);
  font-weight: 700;
}
.quiz-opt.no {
  border-color: var(--bad);
  background: var(--bad-soft);
}
.quiz-opt:disabled { cursor: default; }

.feedback-box {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 12px;
  font-size: .95rem;
  line-height: 1.55;
  animation: fadeIn .2s ease;
}
.feedback-box.ok { background: var(--ok-soft); border-left: 4px solid var(--ok); }
.feedback-box.no { background: var(--bad-soft); border-left: 4px solid var(--bad); }

/* WIDGET STYLES */
.widget-container {
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  margin: 18px 0;
}
.widget-title {
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.widget-slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0;
}
.widget-slider-row input[type="range"] {
  flex: 1;
  accent-color: var(--acc);
}
.widget-stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.widget-stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.widget-stat-card small {
  display: block;
  font-size: .75rem;
  color: var(--mute);
}
.widget-stat-card b {
  font-size: 1.15rem;
  color: var(--acc);
}

/* HISTOGRAM FOR CLT */
.clt-bars {
  display: flex;
  align-items: flex-end;
  height: 120px;
  gap: 2px;
  background: var(--card);
  border-radius: 8px;
  padding: 8px 4px 0;
  margin: 12px 0;
  border: 1px solid var(--line);
}
.clt-bars i {
  flex: 1;
  background: var(--acc);
  border-radius: 2px 2px 0 0;
  min-height: 2px;
  transition: height .2s ease;
}

/* BOTTOM NAVIGATION BUTTONS */
.bottom-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
}
.btn {
  padding: 12px 20px;
  border-radius: 12px;
  font-size: .95rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: .15s;
}
.btn-primary { background: var(--acc); color: #fff; }
.btn-primary:hover { background: var(--acc-hover); }
.btn-secondary { background: var(--card-sub); border: 1px solid var(--line); color: var(--ink); }
.btn-secondary:hover { border-color: var(--mute); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

/* ========================================================
   RESPONSIVE CSS TỐI ƯU TOÀN DIỆN CHO MOBILE & TABLET
   ======================================================== */
.katex-display {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 6px 0;
  -webkit-overflow-scrolling: touch;
}

@media (max-width: 900px) {
  .quiz-layout, .exam-layout, .layout-wrap {
    grid-template-columns: 1fr !important;
  }
  .sidebar, .sidebar-palette, .exam-sidebar {
    position: static !important;
    order: -1 !important;
    margin-bottom: 14px !important;
  }
}

@media (max-width: 768px) {
  .header-wrap, .header-top {
    flex-direction: column !important;
    align-items: stretch !important;
    padding: 8px 12px !important;
    gap: 8px !important;
  }

  .header-actions {
    margin-left: auto;
  }

  .nav-links {
    display: flex !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    white-space: nowrap !important;
    padding: 4px 0 !important;
    gap: 6px !important;
    scrollbar-width: none !important;
  }
  .nav-links::-webkit-scrollbar {
    display: none !important;
  }

  .nav-link, .nav-btn {
    font-size: 0.82rem !important;
    padding: 6px 10px !important;
    min-height: 36px !important;
    flex-shrink: 0 !important;
  }

  .container, main, .main-container {
    padding: 12px 10px 40px !important;
  }

  /* Co giãn font chữ tiêu đề trên mobile */
  h1, .hero-title, .site-title, .lesson-title {
    font-size: clamp(1.2rem, 4.5vw, 1.6rem) !important;
  }
  h2, .section-title, .exercise-title {
    font-size: clamp(1.05rem, 3.8vw, 1.3rem) !important;
  }

  /* Bộ nút bấm cuộn ngang */
  .clusters-nav, .lessons-strip, .topics-nav, .filter-tabs, .mode-tabs, .exam-tabs {
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    white-space: nowrap !important;
    padding-bottom: 6px !important;
    scrollbar-width: none !important;
    gap: 6px !important;
  }
  .clusters-nav::-webkit-scrollbar,
  .lessons-strip::-webkit-scrollbar,
  .topics-nav::-webkit-scrollbar,
  .filter-tabs::-webkit-scrollbar,
  .mode-tabs::-webkit-scrollbar,
  .exam-tabs::-webkit-scrollbar {
    display: none !important;
  }

  .cluster-btn, .lesson-pill, .topic-btn, .filter-btn, .mode-tab, .exam-tab {
    flex-shrink: 0 !important;
    padding: 7px 12px !important;
    font-size: 0.82rem !important;
  }

  /* Thẻ nội dung & Khối bước giải */
  .lesson-card, .exercise-card, .q-card, .formula-card, .essay-card {
    padding: 16px 14px !important;
    border-radius: 12px !important;
  }

  .formulas-grid {
    grid-template-columns: 1fr !important;
    gap: 14px !important;
  }

  /* Tối ưu diện tích bấm cho phương án trắc nghiệm */
  .opt-btn, .opt-label, .quiz-opt {
    padding: 12px 14px !important;
    min-height: 48px !important;
    font-size: 0.92rem !important;
  }

  /* Bảng biểu cuộn ngang không làm vỡ khung hình */
  table {
    display: block !important;
    width: 100% !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
  }

  .modal-dialog, .modal-card {
    width: 95% !important;
    padding: 18px 14px !important;
    max-height: 88vh !important;
  }
}


/* 3-Level Quiz Badges & Cards */
.quiz-level-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .8rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  margin-bottom: 10px;
}
.level-nhan-biet {
  background: rgba(16, 185, 129, 0.15);
  color: #059669;
  border: 1px solid rgba(16, 185, 129, 0.3);
}
.level-thong-hieu {
  background: rgba(245, 158, 11, 0.15);
  color: #d97706;
  border: 1px solid rgba(245, 158, 11, 0.3);
}
.level-van-dung {
  background: rgba(239, 68, 68, 0.15);
  color: #dc2626;
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.quiz-item-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.quiz-congrats-box {
  margin-top: 24px;
  padding: 20px 24px;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(59, 130, 246, 0.1));
  border: 2px solid var(--ok);
  border-radius: 14px;
  text-align: center;
  animation: fadeIn .3s ease;
}


/* Reference Box at Bottom of Lessons */
.lesson-ref-box {
  margin-top: 26px;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 4px solid var(--acc);
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  transition: all .2s ease;
}
.ref-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.ref-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .92rem;
  font-weight: 800;
  color: var(--acc);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.ref-pdf-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--acc-soft);
  color: var(--acc);
  border: 1px solid rgba(37, 99, 235, 0.25);
  font-size: .82rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 8px;
  text-decoration: none;
  transition: all .15s ease;
}
.ref-pdf-btn:hover {
  background: var(--acc);
  color: #fff;
  transform: translateY(-1px);
}
.ref-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 14px;
  font-size: .9rem;
}
.ref-item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  line-height: 1.5;
}
.ref-label {
  font-weight: 700;
  color: var(--mute);
  min-width: 155px;
  font-size: .85rem;
}
.ref-val {
  color: var(--text);
  flex: 1;
}
.ref-key-points {
  margin: 6px 0 0 18px;
  padding: 0;
  color: var(--text);
}
.ref-key-points li {
  margin-bottom: 4px;
  line-height: 1.45;
}
.ref-remind {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: 8px;
  padding: 11px 15px;
  font-size: .88rem;
  line-height: 1.55;
  color: var(--text);
}
.ref-remind-icon {
  font-size: 1.2rem;
  line-height: 1;

      const isActive = i === curLessonIdx;
      html += `<button class="lesson-pill ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="goToLesson(${i})">
        ${isDone ? '✓ ' : ''}${l.id}: ${l.title.split(':')[0]}
      </button>`;
    }
  });
  strip.innerHTML = html;
}

// NAVIGATION FUNCTIONS (SECTION BY SECTION)
function goToLesson(idx) {
  if (idx < 0 || idx >= ALL_LESSONS.length) return;
  curLessonIdx = idx;
  curSubTab = 'theory';
  saveProgress();
  renderLessonsStrip();
  renderCurrentLesson();
  window.scrollTo({ top: 120, behavior: 'smooth' });
}

function switchSubTab(tab) {
  if (!SUB_TABS.includes(tab)) return;
  curSubTab = tab;
  renderCurrentLesson();
  // Smooth scroll to lesson content
  const tabContent = document.getElementById('tabContent');
  if (tabContent) {
    const yOffset = -140;
    const y = tabContent.getBoundingClientRect().top + window.pageYOffset + yOffset;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  }
}

function prevSection() {
  const tabIdx = SUB_TABS.indexOf(curSubTab);
  if (tabIdx > 0) {
    // Chuyển về sub-tab trước trong bài hiện tại
    switchSubTab(SUB_TABS[tabIdx - 1]);
  } else {
    // Đang ở tab đầu (theory): chuyển về bài học trước đó nếu có
    if (curLessonIdx > 0) {
      goToLesson(curLessonIdx - 1);
    }
  }
}

function nextSection() {
  const tabIdx = SUB_TABS.indexOf(curSubTab);
  if (tabIdx < SUB_TABS.length - 1) {
    // Chuyển sang sub-tab tiếp theo trong bài hiện tại
    switchSubTab(SUB_TABS[tabIdx + 1]);
  } else {
    // Đang ở tab cuối (quiz): Kiểm tra xem đã hoàn thành kiểm tra chưa
    const l = ALL_LESSONS[curLessonIdx];
    const qList = (l.quizzes && l.quizzes.length) ? l.quizzes : [l.final_quiz];
    const userAnswers = lessonQuizAnswers[l.id] || {};
    const isDone = completedLessons[l.id] || (Object.keys(userAnswers).length >= qList.length);

    if (isDone) {
      if (curLessonIdx < ALL_LESSONS.length - 1) {
        goToLesson(curLessonIdx + 1);
      }
    } else {
      alert(`Vui lòng hoàn thành đủ ${qList.length} câu trắc nghiệm kiểm tra để mở khóa bài học tiếp theo!`);
    }
  }
}

function updateNavButtons() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (!prevBtn || !nextBtn) return;

  const l = ALL_LESSONS[curLessonIdx];
  const tabIdx = SUB_TABS.indexOf(curSubTab);
  const qList = (l.quizzes && l.quizzes.length) ? l.quizzes : [l.final_quiz];
  const userAnswers = lessonQuizAnswers[l.id] || {};
  const answeredCount = Object.keys(userAnswers).length;
  const isDone = completedLessons[l.id] || (answeredCount >= qList.length);

  // 1. UPDATE PREV BUTTON
  if (tabIdx > 0) {
    prevBtn.disabled = false;
    prevBtn.innerHTML = `← Phần trước: ${SUB_TAB_NAMES[SUB_TABS[tabIdx - 1]]}`;
  } else {
    if (curLessonIdx > 0) {
      prevBtn.disabled = false;
      prevBtn.innerHTML = `← Bài trước (${ALL_LESSONS[curLessonIdx - 1].id})`;
    } else {
      prevBtn.disabled = true;
      prevBtn.innerHTML = `← Bắt đầu khóa học`;
    }
  }

  // 2. UPDATE NEXT BUTTON
  if (tabIdx < SUB_TABS.length - 1) {
    // Vẫn còn các sub-tab tiếp theo trong bài này
    nextBtn.disabled = false;
    nextBtn.className = 'btn btn-primary';
    nextBtn.innerHTML = `Sang phần: ${SUB_TAB_NAMES[SUB_TABS[tabIdx + 1]]} →`;
  } else {
    // Đang ở tab 'quiz' (phần cuối cùng của bài)
    if (!isDone) {
      nextBtn.disabled = true;
      nextBtn.className = 'btn btn-secondary';
      nextBtn.innerHTML = `🔒 Hoàn thành kiểm tra để mở bài tiếp (${answeredCount}/${qList.length})`;
    } else {
      if (curLessonIdx < ALL_LESSONS.length - 1) {
        const nextL = ALL_LESSONS[curLessonIdx + 1];
        nextBtn.disabled = false;
        nextBtn.className = 'btn btn-primary';
        nextBtn.innerHTML = `🎉 Mở khóa bài tiếp theo: ${nextL.id} →`;
      } else {
        nextBtn.disabled = true;
        nextBtn.className = 'btn btn-secondary';
        nextBtn.innerHTML = `🏆 Bạn đã hoàn thành toàn bộ 26 bài học!`;
      }
    }
  }
}

// RENDER CURRENT LESSON
function renderCurrentLesson() {
  const l = ALL_LESSONS[curLessonIdx];
  if (!l) return;

  document.getElementById('clusterBadge').textContent = `Cụm ${l.cluster}`;
  document.getElementById('sourceBadge').textContent = l.sources;
  document.getElementById('lessonTitle').textContent = `${l.id}: ${l.title}`;
  document.getElementById('lessonDesc').textContent = l.desc;

  // Update Progress
  const totalDone = Object.keys(completedLessons).length;
  document.getElementById('statsBadge').textContent = `${totalDone}/${ALL_LESSONS.length} bài`;
  document.getElementById('progressBar').style.width = `${(totalDone / ALL_LESSONS.length) * 100}%`;

  // Update Sub Tabs Active State
  document.querySelectorAll('.sub-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === curSubTab);
  });

  // Render Sub Tab Content
  const container = document.getElementById('tabContent');
  if (curSubTab === 'theory') {
    container.innerHTML = renderTheory(l);
    if (l.widget === 'outlier_widget') initOutlierWidget();
    if (l.widget === 'clt_widget') initCltWidget();
  } else if (curSubTab === 'examples') {
    container.innerHTML = renderExamples(l);
  } else if (curSubTab === 'pitfalls') {
    container.innerHTML = renderPitfalls(l);
  } else if (curSubTab === 'quiz') {
    container.innerHTML = renderQuiz(l);
    attachQuizEvents(l);
  }

  // Update Navigation Buttons dynamically
  renderRefBox(l);
  updateNavButtons();

  // Render Math with KaTeX
  if (window.renderMathInElement) {
      const refBoxEl = document.getElementById('lessonRefBox');
  if (window.renderMathInElement && refBoxEl) {
    renderMathInElement(refBoxEl, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
    renderMathInElement(container, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
}

// 3-LEVEL QUIZ RENDERER
function renderQuiz(l) {
  const qList = (l.quizzes && l.quizzes.length) ? l.quizzes : [l.final_quiz];
  const userAnswers = lessonQuizAnswers[l.id] || {};
  const answeredCount = Object.keys(userAnswers).length;
  const isAllAnswered = answeredCount >= qList.length;

  let html = `<div class="quiz-container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <div>
        <h3 style="margin:0;font-size:1.15rem;color:var(--text);font-weight:800;">
          🎯 Bài Kiểm Tra Năng Lực (3 Cấp độ: Nhận biết — Thông hiểu — Vận dụng)
        </h3>
        <p style="margin:4px 0 0;font-size:.88rem;color:var(--mute);">
          Hãy hoàn thành đủ ${qList.length} câu hỏi dưới đây để mở khóa bài học tiếp theo.
        </p>
      </div>
      <span class="badge" id="quizCounterBadge" style="background:var(--acc-soft);color:var(--acc);padding:5px 12px;border-radius:999px;font-weight:700;font-size:.85rem;">
        Tiến độ: ${answeredCount}/${qList.length} câu
      </span>
    </div>`;

  qList.forEach((q, qIdx) => {
    const levelClass = (q.level === 'Nhận biết') ? 'level-nhan-biet' : ((q.level === 'Thông hiểu') ? 'level-thong-hieu' : 'level-van-dung');
    const levelIcon = (q.level === 'Nhận biết') ? '🟢 Cấp độ 1: Nhận biết' : ((q.level === 'Thông hiểu') ? '🟡 Cấp độ 2: Thông hiểu' : '🔴 Cấp độ 3: Vận dụng / Bẫy kinh điển');
    const chosenIdx = userAnswers[qIdx];
    const isAnswered = chosenIdx !== undefined;

    html += `<div class="quiz-item-card" id="quizCard_${qIdx}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="quiz-level-badge ${levelClass}">${levelIcon}</span>
        <span style="font-size:.8rem;color:var(--mute);font-weight:600;">Câu ${qIdx + 1} / ${qList.length}</span>
      </div>
      <div class="quiz-q" style="font-size:1.02rem;margin-bottom:14px;line-height:1.55;">${q.q}</div>
      <div class="quiz-opts" id="quizOpts_${qIdx}">`;

    q.opts.forEach((opt, oIdx) => {
      let optClass = 'quiz-opt';
      let disabledAttr = isAnswered ? 'disabled' : '';
      if (isAnswered) {
        if (oIdx === q.ans) optClass += ' ok';
        else if (oIdx === chosenIdx) optClass += ' no';
      }
      html += `<button class="${optClass}" data-qidx="${qIdx}" data-oidx="${oIdx}" ${disabledAttr}>
        <span style="display:inline-block;width:22px;font-weight:700;">${String.fromCharCode(65 + oIdx)}.</span> ${opt}
      </button>`;
    });

    html += `</div>
      <div id="quizFeedback_${qIdx}">`;
    if (isAnswered) {
      const isCorrect = (chosenIdx === q.ans);
      html += `<div class="feedback-box ${isCorrect ? 'ok' : 'no'}">
        <b>${isCorrect ? '🎉 RẤT XUẤT SẮC! ĐÚNG RỒI!' : '⚠️ CHƯA CHÍNH XÁC!'}</b><br>
        ${!isCorrect ? `Đáp án chính xác: <b>${String.fromCharCode(65 + q.ans)}. ${q.opts[q.ans]}</b><br>` : ''}
        ${typeof q.fb === 'string' ? q.fb : (q.fb[chosenIdx] || '')}
      </div>`;
    }
    html += `</div></div>`;
  });

  // Hộp chúc mừng khi hoàn thành cả 3 câu
  if (isAllAnswered) {
    let correctCount = 0;
    qList.forEach((q, idx) => {
      if (userAnswers[idx] === q.ans) correctCount++;
    });
    html += `<div class="quiz-congrats-box">
      <div style="font-size:1.35rem;font-weight:800;color:var(--ok);margin-bottom:6px;">
        🎉 CHÚC MỪNG BẠN ĐÃ HOÀN THÀNH BÀI KIỂM TRA!
      </div>
      <div style="font-size:.95rem;color:var(--ink);margin-bottom:14px;">
        Bạn đã trả lời đúng <b>${correctCount}/${qList.length}</b> câu hỏi. Bài học <b>${l.id}: ${l.title.split(':')[0]}</b> đã được ghi nhận hoàn thành!
      </div>
      ${l.ref ? `
        <div style="margin: 14px 0 16px; padding: 10px 14px; background: rgba(255,255,255,0.6); border: 1px dashed rgba(0,0,0,0.15); border-radius: 8px; font-size: .86rem; color: var(--text); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
          <span>📌 <b>Muốn ôn luyện sâu hơn?</b> Tra cứu tại: <b>${l.ref.slide_name} (${l.ref.pages})</b></span>
          <a href="/${l.ref.slide_file}#page=${l.ref.page_start}" target="_blank" class="mini-pdf-link">
            📄 Mở Slide (${l.ref.slide_file}) ↗
          </a>
        </div>
      ` : ''}
      ${curLessonIdx < ALL_LESSONS.length - 1 ? `
        <button class="btn btn-primary" onclick="nextSection()" style="font-size:1rem;padding:10px 22px;">
          Tiếp tục sang bài tiếp theo (${ALL_LESSONS[curLessonIdx + 1].id}) →
        </button>
      ` : `
        <div style="display:inline-block;background:var(--ok);color:#fff;font-weight:700;padding:8px 18px;border-radius:999px;">
          🏆 Bạn đã hoàn thành toàn bộ 26 bài học trong chương trình!
        </div>
      `}
    </div>`;
  }

  html += `</div>`;
  return html;
}

function attachQuizEvents(l) {
  const qList = (l.quizzes && l.quizzes.length) ? l.quizzes : [l.final_quiz];
  if (!lessonQuizAnswers[l.id]) {
    lessonQuizAnswers[l.id] = {};
  }

  document.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.onclick = () => {
      const qIdx = +btn.dataset.qidx;
      const oIdx = +btn.dataset.oidx;
      const q = qList[qIdx];
      if (!q) return;

      // Save answer
      lessonQuizAnswers[l.id][qIdx] = oIdx;
      const isCorrect = (oIdx === q.ans);

      // Disable buttons for this question & highlight
      const card = document.getElementById(`quizCard_${qIdx}`);
      if (card) {
        card.querySelectorAll('.quiz-opt').forEach(b => {
          b.disabled = true;
          const curO = +b.dataset.oidx;
          if (curO === q.ans) b.classList.add('ok');
          else if (curO === oIdx) b.classList.add('no');
        });

        // Show feedback
        const fbEl = document.getElementById(`quizFeedback_${qIdx}`);
        if (fbEl) {
          fbEl.innerHTML = `<div class="feedback-box ${isCorrect ? 'ok' : 'no'}">
            <b>${isCorrect ? '🎉 RẤT XUẤT SẮC! ĐÚNG RỒI!' : '⚠️ CHƯA CHÍNH XÁC!'}</b><br>
            ${!isCorrect ? `Đáp án chính xác: <b>${String.fromCharCode(65 + q.ans)}. ${q.opts[q.ans]}</b><br>` : ''}
            ${typeof q.fb === 'string' ? q.fb : (q.fb[oIdx] || '')}
          </div>`;
          // Render math in feedback if any
          if (window.renderMathInElement) {
            renderMathInElement(fbEl, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
              ],
              throwOnError: false
            });
          }
        }
      }

      // Check overall quiz completion
      const answeredCount = Object.keys(lessonQuizAnswers[l.id]).length;
      const counterEl = document.getElementById('quizCounterBadge');
      if (counterEl) {
        counterEl.textContent = `Tiến độ: ${answeredCount}/${qList.length} câu`;
      }

      // If finished all 3 questions
      if (answeredCount >= qList.length) {
        completedLessons[l.id] = true;
        saveProgress();
        renderLessonsStrip();
        const totalDone = Object.keys(completedLessons).length;
        document.getElementById('statsBadge').textContent = `${totalDone}/${ALL_LESSONS.length} bài`;
        document.getElementById('progressBar').style.width = `${(totalDone / ALL_LESSONS.length) * 100}%`;

        // Re-render quiz to show congrats box
        const container = document.getElementById('tabContent');
        if (container) {
          container.innerHTML = renderQuiz(l);
          attachQuizEvents(l);
          if (window.renderMathInElement) {
              const refBoxEl = document.getElementById('lessonRefBox');
  if (window.renderMathInElement && refBoxEl) {
    renderMathInElement(refBoxEl, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
    renderMathInElement(container, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
              ],
              throwOnError: false
            });
          }
        }
      }

      // Update bottom nav buttons immediately
      renderRefBox(l);
  updateNavButtons();
    };
  });
}

// INTERACTIVE WIDGET 1: OUTLIER SLIDER
function initOutlierWidget() {
  const slider = document.getElementById('outlierSlider');
  const valText = document.getElementById('outlierVal');
  const valCopy = document.getElementById('outlierValCopy');
  const meanText = document.getElementById('meanVal');
  const medianText = document.getElementById('medianVal');
  if (!slider) return;

  function update() {
    const x = +slider.value;
    if (valText) valText.textContent = x;
    if (valCopy) valCopy.textContent = x;
    const arr = [4, 6, 7, 7, x];
    const mean = (4 + 6 + 7 + 7 + x) / 5;
    arr.sort((a, b) => a - b);
    const median = arr[2];

    if (meanText) {
      meanText.textContent = mean.toFixed(1);
      if (x > 20) {
        meanText.style.color = 'var(--bad)';
      } else {
        meanText.style.color = 'var(--acc)';
      }
    }
    if (medianText) medianText.textContent = median;
  }
  slider.oninput = update;
  update();
}

// INTERACTIVE WIDGET 2: CLT SIMULATOR
function initCltWidget() {
  window.runClt = function(n) {
    document.querySelectorAll('#cltWidget .btn').forEach(b => {
      b.classList.remove('btn-primary');
      b.classList.add('btn-secondary');
    });
    const activeBtn = document.getElementById(`cltBtn${n}`);
    if (activeBtn) {
      activeBtn.classList.remove('btn-secondary');
      activeBtn.classList.add('btn-primary');
    }

    const reps = 1500;
    const bins = 28;
    const counts = new Array(bins).fill(0);
    let sumMeans = 0;

    for (let i = 0; i < reps; i++) {
      let sampleSum = 0;
      // Exponential distribution samples
      for (let k = 0; k < n; k++) {
        sampleSum -= Math.log(1 - Math.random());
      }
      const sampleMean = sampleSum / n;
      sumMeans += sampleMean;
      const binIdx = Math.min(bins - 1, Math.max(0, Math.floor((sampleMean / 2.5) * bins)));
      counts[binIdx]++;
    }

    const maxCount = Math.max(...counts);
    let barsHtml = '';
    counts.forEach(c => {
      const pct = (c / maxCount) * 100;
      barsHtml += `<i style="height: ${Math.max(3, pct)}%;"></i>`;
    });

    const barsEl = document.getElementById('cltBars');
    if (barsEl) barsEl.innerHTML = barsHtml;
    const avg = (sumMeans / reps).toFixed(2);
    const theorySd = (1 / Math.sqrt(n)).toFixed(2);
    const infoEl = document.getElementById('cltInfo');
    if (infoEl) {
      infoEl.innerHTML = `Trung bình mẫu mô phỏng ≈ <b>${avg}</b>. Sai số lý thuyết σ/√n = 1/√${n} ≈ <b>${theorySd}</b>. ${n >= 15 ? 'Đồ thị đã thành hình chuông Gauss đối xứng!' : 'Đồ thị vẫn còn bị lệch phải do cỡ mẫu nhỏ.'}`;
    }
  };

  runClt(1);
}
